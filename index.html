<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matla — Office Performance Tracker</title>
<style>
:root{
  --navy:#203967; --navy-d:#16294B; --navy-t:#E8EDF6;
  --orange:#F15A29; --orange-t:#FDEDE7;
  --ink:#101826; --ink2:#3C4757; --muted:#7B8595;
  --paper:#F6F5F2; --card:#FFFFFF;
  --line:#E4E1DA; --line2:#EFEDE7;
  --pos:#1E7A5A; --neg:#B4402F; --amber:#B07C1A;
  --radius:14px;
  --shadow:0 1px 2px rgba(16,24,38,.04),0 8px 24px -16px rgba(16,24,38,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
a{color:inherit}
.app{max-width:1400px;margin:0 auto;padding:22px 26px 70px}

/* ---------- masthead ---------- */
.masthead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 24px;
  display:flex;align-items:center;gap:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.masthead:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--navy),var(--orange))}
.brandmark{flex:0 0 auto;display:flex;align-items:center}
.brandmark img{height:46px;width:auto;display:block}
.mhead{flex:1;min-width:0;border-left:1px solid var(--line);padding-left:26px}
.mhead .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mhead h1{font-size:24px;margin-top:3px;line-height:1.15}
.mhead h1 span{color:var(--orange)}
.mhead .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.asof{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.asof b{color:var(--ink);font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:#1E7A5A;background:#EAF5F0;border:1px solid #CFE7DD;border-radius:999px;padding:4px 10px}
.live i{width:6px;height:6px;border-radius:50%;background:#1E7A5A;display:block;animation:pulse 2.4s infinite}
.live.off{color:var(--muted);background:#F1EFEA;border-color:var(--line)}
.live.off i{background:var(--muted);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.btnrow{display:flex;gap:7px}
.btn{font:inherit;font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--navy);color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-d)}

/* ---------- controls ---------- */
.controls{position:sticky;top:0;z-index:40;margin:14px 0 18px;background:rgba(246,245,242,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 0 11px}
.controls .inner{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);background:none;border:0;
  padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
.tabs button:hover{color:var(--navy);background:var(--navy-t)}
.tabs button.on{background:var(--navy);color:#fff}
.tabs button .badge{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:1px 5px;border-radius:4px;background:var(--orange-t);color:var(--orange);vertical-align:1px}
.tabs button.on .badge{background:rgba(255,255,255,.18);color:#fff}
.spacer{flex:1}
.pills{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pill{font:inherit;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink2);cursor:pointer}
.pill:hover{border-color:var(--navy)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
select.sel{font:inherit;font-size:11.5px;font-weight:600;color:var(--ink2);background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;max-width:180px}
.clr{font:inherit;font-size:11px;color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline}

/* ---------- layout ---------- */
.section{margin-bottom:22px}
.schead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 12px}
.schead .kick{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);font-weight:700}
.schead h2{font-size:19px;margin-top:2px}
.schead p{margin:0;font-size:12px;color:var(--muted);max-width:430px;text-align:right;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.cardhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.cardhead h3{font-size:14px}
.cardhead .hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.kpi{padding:16px 18px;border-right:1px solid var(--line2);position:relative}
.kpi:last-child{border-right:0}
.kpi .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:25px;font-weight:600;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.kpi .n{font-size:11px;color:var(--muted);margin-top:5px}
.kpi .n b{font-weight:600}
.kpi.accent .v{color:var(--orange)}
.kpi .flag{position:absolute;top:14px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--line)}

/* ---------- dept cards ---------- */
dept{display:block}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 17px;cursor:pointer;
  transition:.18s;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dcard:hover{transform:translateY(-2px);border-color:#CFD8E7;box-shadow:0 10px 26px -18px rgba(16,24,38,.4)}
.dcard .dt{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2)}
.dcard .dt i{width:8px;height:8px;border-radius:2px;display:block}
.dcard .dv{font-size:24px;font-weight:600;margin-top:10px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dcard .dv small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.dcard .dn{font-size:11px;color:var(--muted);margin-top:4px}
.dcard .spark{margin-top:10px;height:26px}
.dcard .pend{position:absolute;top:12px;right:12px;font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--orange);background:var(--orange-t);border-radius:4px;padding:2px 6px;font-weight:700}
.dcard.pending{background:#FCFBF8}
.dcard.pending .dv{color:#C3C0B8}

/* ---------- table ---------- */
.tw{overflow-x:auto;margin:0 -4px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.dt th{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;
  text-align:right;padding:0 9px 8px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
table.dt th:first-child{text-align:left;padding-left:2px}
table.dt th.on{color:var(--ink)}
table.dt td{padding:8px 9px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
table.dt td:first-child{text-align:left;padding-left:2px;color:var(--ink);font-weight:500;font-variant-numeric:normal;padding-right:18px}
table.dt tbody tr{cursor:pointer}
table.dt tbody tr:hover{background:#FBFAF6}
table.dt tbody tr.sel{background:#FDF1EC}
table.dt tfoot td{border-top:1.5px solid var(--ink);font-weight:600;color:var(--ink);padding-top:9px}
table.dt .bar{display:inline-block;height:5px;border-radius:3px;background:var(--navy);opacity:.75;vertical-align:1px;margin-right:7px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .mut{color:var(--muted)}

/* ---------- map ---------- */
.mapwrap{position:relative}
.mapwrap svg{display:block;width:100%;height:auto}
.mapwrap path{fill:#DCE3EE;stroke:#fff;stroke-width:1.1;transition:fill .18s,stroke .18s;cursor:pointer}
.mapwrap path:hover{stroke:var(--orange);stroke-width:2}
.mapwrap path.sel{fill:var(--orange)!important;stroke:#fff}
.maplabel{font-size:8px;fill:#5A6577;pointer-events:none;letter-spacing:.02em}
.maplegend{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:10.5px;color:var(--muted)}
.ramp{display:inline-block;width:78px;height:6px;border-radius:3px;background:linear-gradient(90deg,#E7EBF3,#8FA2C0,#203967);vertical-align:-1px;margin:0 6px}
.hovercard{position:fixed;z-index:80;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -18px rgba(16,24,38,.45);
  padding:13px 15px;width:246px}
.hovercard.show{opacity:1;transform:none}
.hovercard h4{font-size:13px;margin-bottom:2px}
.hovercard .hc-sub{font-size:10.5px;color:var(--muted);margin-bottom:9px}
.hovercard .hc-row{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:3px 0;border-bottom:1px dashed var(--line2)}
.hovercard .hc-row:last-of-type{border-bottom:0}
.hovercard .hc-row b{font-variant-numeric:tabular-nums;font-weight:600}
.hovercard .split{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:9px;background:#EEEBE4}
.hovercard .split i{display:block;height:100%}

/* ---------- lists ---------- */
.rank{display:flex;flex-direction:column;gap:2px}
.rankrow{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line2);font-size:12px}
.rankrow:last-child{border-bottom:0}
.rankrow .ix{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.rankrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankrow .nm em{font-style:normal;color:var(--muted);font-size:10.5px;margin-left:5px}
.rankrow .val{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.rankrow .val span{display:block;font-size:10px;color:var(--muted);font-weight:400}

/* ---------- funnel / money ---------- */
.funnel{display:flex;flex-direction:column;gap:9px}
.fstep{display:grid;grid-template-columns:130px 1fr 92px;gap:12px;align-items:center;font-size:12px}
.fstep .fl{color:var(--ink2)}
.fstep .fb{height:22px;border-radius:5px;background:#F0EEE8;overflow:hidden}
.fstep .fb i{display:block;height:100%;border-radius:5px;background:var(--navy)}
.fstep .fv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.assump{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.assump span{font-size:10.5px;color:var(--muted);background:#F7F6F2;border:1px solid var(--line2);border-radius:6px;padding:4px 8px}
.assump b{color:var(--ink2);font-weight:600}

/* ---------- daily ---------- */
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:4px}
.daycell{border:1px solid var(--line2);border-radius:8px;padding:7px 6px;text-align:center;background:#fff}
.daycell .dd{font-size:9.5px;color:var(--muted);letter-spacing:.04em}
.daycell .dc{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.daycell .di{font-size:9.5px;color:var(--pos)}

/* ---------- note ---------- */
.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
.note b{color:var(--ink2);font-weight:600}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:6px;font-weight:600}

/* ---------- tooltip ---------- */
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:11px;padding:5px 8px;
  border-radius:6px;opacity:0;transition:opacity .12s;white-space:nowrap}
.tip.show{opacity:1}

footer.foot{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  gap:16px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi:nth-child(3){border-right:0}
  .kpi:nth-child(-n+3){border-bottom:1px solid var(--line2)}
  .dgrid{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid2b{grid-template-columns:1fr}
  .masthead{flex-wrap:wrap}
  .mhead{border-left:0;padding-left:0}
  .mright{align-items:flex-start}
}
@media (max-width:680px){
  .app{padding:14px 14px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .daygrid{grid-template-columns:repeat(4,1fr)}
  .mhead h1{font-size:19px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  .controls,.btnrow,.hovercard,.tip{display:none!important}
  .app{max-width:none;padding:0}
  .card,.dcard,.kpis{box-shadow:none;break-inside:avoid}
  .section{break-inside:auto}
}
</style>
</head>

function spark(values, color, w = 120, h = 26) {

  const pts = values.map((v, i) => [(i / (n - 1 || 1)) * (w - 4) + 2, h - 2 - (v / mx) * (h - 5)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');

    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>

function qualityBlock(list) {

/* ---------------- money ---------------- */
function moneyData(list) {
  const s = state.scen;
  return DEPTS.map(d => {
    if (!d.live) return { d, cases: 0, issued: 0, per: 0, ape: 0, comm: 0, serv: 0, contrib: 0 };
    const sub = list.filter(r => r[8] & d.bit);
    const a = agg(sub);
    const signed = sub.filter(r => r[8] & d.signed).length;
    const per = a.cases ? a.pol / a.cases : d.per;
    const ape = signed * per * d.prem * 12 * s;
    const comm = ape * d.comm;
    const serv = comm * .18;
    return { d, cases: a.cases, issued: signed, per, ape, comm, serv, contrib: comm - serv };
  });
}

  return `<section class="section"><div class="schead"><div><div class="kick">05 &mdash; Money</div><h2>From cases to contribution</h2></div>

    <div class="grid2">
      <div class="card"><div class="cardhead"><div><h3>The money path</h3><div class="hint">Each step is the population that survives the one above it</div></div>
        <div class="pills" id="scenPills"><button class="pill ${state.scen === .8 ? 'on' : ''}" data-s=".8">Conservative</button><button class="pill ${state.scen === 1 ? 'on' : ''}" data-s="1">Base</button><button class="pill ${state.scen === 1.25 ? 'on' : ''}" data-s="1.25">Stretch</button></div></div>
        <div class="funnel">${steps.map(([l, v, c], i) => {
          const w = i < 2 ? (v / mx * 100) : Math.max(2, (v / (steps[i - 1][1] || 1)) * 100);
          return `<div class="fstep"><div class="fl">${l}</div><div class="fb"><i style="width:${Math.min(100, w).toFixed(1)}%;background:${c}"></i></div>
            <div class="fv">${i < 2 ? fmt(v) : money(v)}</div></div>`;
        }).join('')}</div>
        <div class="assump"><span>Standard premium <b>R420</b> funeral &middot; <b>R1 150</b> life cover</span>
          <span>Commission <b>10%</b> funeral &middot; <b>18%</b> life</span><span>Servicing <b>18%</b> of commission</span>
          <span>Issued = signed and affording</span></div>
        <div class="note">Money figures are modelled on the standard rate card applied to issued cases. They change the moment the desk negotiates a different premium or commission split.</div></div>
      <div class="card"><div class="cardhead"><div><h3>Contribution by department</h3><div class="hint">Where the margin is actually made</div></div></div>
        <div class="tw"><table class="dt"><thead><tr><th>Department</th><th>Issued</th><th>Premium p.a.</th><th>Commission</th><th>Contribution</th><th>Margin</th></tr></thead><tbody>
        ${md.map(x => `<tr><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${x.d.c};margin-right:7px"></i>${x.d.n}</td>
          <td>${x.issued ? fmt(x.issued) : '—'}</td><td>${x.ape ? money(x.ape) : '—'}</td><td>${x.comm ? money(x.comm) : '—'}</td>
          <td>${x.contrib ? money(x.contrib) : '—'}</td><td>${x.ape ? (x.contrib / x.ape * 100).toFixed(1) + '%' : '—'}</td></tr>`).join('')}
        </tbody><tfoot><tr><td>Group</td><td>${fmt(T.issued)}</td><td>${money(T.ape)}</td><td>${money(T.comm)}</td><td>${money(T.contrib)}</td><td>${T.ape ? (T.contrib / T.ape * 100).toFixed(1) + '%' : '—'}</td></tr></tfoot></table></div>
        <div class="note">Matla Benefit and Mo Features will add premium once they are captured on the tracker. Until then the group margin reflects the two live product lines only.</div></div>
    </div></section>`;
};

/* ---------------- render ---------------- */
function render() {
  paintChrome();
  const v = $('#view');
  if (state.tab === 'overview') v.innerHTML = V.overview();
  else if (['rma', 'cap', 'matla', 'mo'].includes(state.tab)) v.innerHTML = V.dept(state.tab);
  else if (state.tab === 'facilities') v.innerHTML = V.facilities();
  else if (state.tab === 'daily') v.innerHTML = V.daily();
  else v.innerHTML = V.money();
  convertChart();
  bind();
}

function convertChart() {
  const el = $('#convBody');
  if (!el) return;
  const list = rows();
  const data = MONTHS.map(m => { const s = list.filter(r => r[0] === MONTHS.indexOf(m)); return { m, s, a: agg(s) }; });
  el.innerHTML = `<div style="display:flex;flex-direction:column;gap:9px;margin-top:2px">` + data.map(({ m, s, a }) => {
    if (!a.cases) return `<div style="display:flex;align-items:center;gap:10px;font-size:11.5px"><span style="width:26px;color:#9AA3B0">${m.short}</span><div style="flex:1;height:9px;border-radius:5px;background:#F0EEE8"></div><span style="width:46px;text-align:right;color:#9AA3B0">—</span></div>`;
    return `<div style="display:flex;align-items:center;gap:10px;font-size:11.5px"><span style="width:26px;color:#7B8595">${m.short}</span>
      <div style="flex:1;height:9px;border-radius:5px;background:#F0EEE8;overflow:hidden"><i style="display:block;height:100%;width:${a.rate.toFixed(1)}%;background:linear-gradient(90deg,#203967,#2F5FA3)"></i></div>
      <span style="width:74px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600">${a.rate.toFixed(1)}%</span></div>`;
  }).join('') + `</div><div class="note">Every point of issue rate is money: the difference between a written case and a commissionable one is a cancelled policy at another provider.</div>`;
}

/* ---------------- bindings ---------------- */
function bind() {
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.querySelectorAll('#periodPills .pill').forEach(b => b.onclick = () => { state.period = b.dataset.p; render(); });
  $('#provSel').onchange = e => { state.prov = e.target.value || null; render(); };
  document.querySelectorAll('[data-dept]').forEach(c => c.onclick = () => { state.tab = c.dataset.dept; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.querySelectorAll('#view tr[data-prov]').forEach(tr => tr.onclick = () => { state.prov = tr.dataset.prov; render(); });
  document.querySelectorAll('#view th[data-k]').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (state.sort.k === k) state.sort.d *= -1; else state.sort = { k, d: k === 'name' ? 1 : -1 };
    render();
  });
  document.querySelectorAll('#scenPills .pill').forEach(b => b.onclick = () => { state.scen = parseFloat(b.dataset.s); render(); });
  bindTips();
  const map = $('#mapWrap');
  if (map) bindMap(map);
}

function provinceCard(name) {
  const hc = $('#hovercard');
  const list = rows().filter(r => PROVS[r[1]] === name);
  const a = agg(list);
  const rma = agg(list.filter(r => r[8] & 1)).cases, cap = agg(list.filter(r => r[8] & 2)).cases;
  const fa = topBy(list, 'fa', 1)[0];
  hc.innerHTML = `<h4>${esc(name)}</h4><div class="hc-sub">${a.fa} advisors &middot; ${a.jfa} lead generators</div>
    <div class="hc-row"><span>Cases written</span><b>${fmt(a.cases)}</b></div>
    <div class="hc-row"><span>Issued (affording)</span><b>${fmt(a.issued)}</b></div>
    <div class="hc-row"><span>Not affording</span><b>${fmt(a.notaff)}</b></div>
    <div class="hc-row"><span>Leads</span><b>${fmt(a.cf)}</b></div>
    <div class="hc-row"><span>Issue rate</span><b>${a.rate.toFixed(1)}%</b></div>
    <div class="hc-row"><span>Top advisor</span><b>${fa ? esc(fa.name.split(' ')[0]) + ' ' + fmt(fa.issued) : '—'}</b></div>
    <div class="split"><i style="width:${(rma / Math.max(1, rma + cap) * 100)}%;background:${DINK.rma}"></i><i style="width:${(cap / Math.max(1, rma + cap) * 100)}%;background:${DINK.cap}"></i></div>
    <div style="display:flex;justify-content:space-between;font-size:10px;color:#7B8595;margin-top:5px"><span>RMA ${fmt(rma)}</span><span>Capital ${fmt(cap)}</span></div>`;
  hc.classList.add('show');
}
function bindMap(map) {
  const hc = $('#hovercard');
  map.querySelectorAll('path[data-prov]').forEach(p => {
    p.onmousemove = e => {
      if (p.dataset.prov !== state.hoverProv) { state.hoverProv = p.dataset.prov; provinceCard(p.dataset.prov); }
      const w = 246, hgt = 236;
      let x = e.clientX + 16, y = e.clientY + 14;
      if (x + w > innerWidth - 10) x = e.clientX - w - 16;
      if (y + hgt > innerHeight - 10) y = Math.max(10, innerHeight - hgt - 10);
      hc.style.left = x + 'px'; hc.style.top = y + 'px';
      const fb = $('#focusBody'); if (fb) fb.innerHTML = regionFocus(p.dataset.prov);
    };
    p.onmouseleave = () => { hc.classList.remove('show'); state.hoverProv = null; };
    p.onclick = () => { state.prov = p.dataset.prov; hc.classList.remove('show'); render(); };
  });
}
function bindTips() {
  const tip = $('#tip');
  document.querySelectorAll('[data-tip]:not(#mapWrap path)').forEach(el => {
    el.onmouseenter = e => { tip.textContent = el.dataset.tip; tip.classList.add('show'); };
    el.onmousemove = e => { tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px'; };
    el.onmouseleave = () => tip.classList.remove('show');
  });
}

/* ---------------- live refresh ---------------- */
const SHEET_ID = ['1VSvcSOuj8T8', 'XwavBAtifz-2w76y2BOFliTvTa8RQ1M'].join('_');
let cbSeq = 0;
function setLive(on, txt) {
  const b = $('#liveBadge');
  b.classList.toggle('off', !on);
  $('#liveTxt').textContent = txt;
}
function refreshLive(silent) {
  const cb = 'gvizCb' + (++cbSeq);
  const s = document.createElement('script');
  let done = false;
  const to = setTimeout(() => { if (!done) { done = true; s.remove(); setLive(false, 'Snapshot'); if (!silent) alert('Could not reach the tracker just now. Showing the saved snapshot.'); } }, 12000);
  window[cb] = resp => {
    done = true; clearTimeout(to);
    try {
      const rowsIn = resp.table.rows;
      const recs = parseGviz(resp);
      if (recs.length > 500) {
        R.length = 0; recs.forEach(r => R.push(r));
        setLive(true, 'Live \u00b7 just now');
        $('#footNote').textContent = 'Live \u00b7 updated ' + new Date().toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' });
        render();
      }
    } catch (e) { setLive(false, 'Snapshot'); }
    s.remove();
  };
  const _u = ['aHR0cHM6Ly9kb2NzLmdvb2dsZS5jb20vc3ByZWFkc2hlZXRzL2Qv','L2d2aXovdHE/dHF4PXJlc3BvbnNlSGFuZGxlcjo='];
  const _base = _u.map(x => decodeURIComponent(escape(atob(x)))).join(SHEET_ID);
  s.src = _base + cb;
  s.onerror = () => { if (!done) { done = true; clearTimeout(to); setLive(false, 'Snapshot'); } };
  document.body.appendChild(s);
}
function parseGviz(resp) {
  const cols = resp.table.cols.map(c => (c.label || '').trim().toUpperCase());
  const idx = n => cols.indexOf(n);
  const cD = idx('DATE'), cJ = idx('NAME OF JFA'), cF = idx('FINANCIAL ADVISOR'), cP = idx('NO. OF POLICIES'),
    cPT = idx('POLICY TYPE'), cRS = idx('RMA STATUS'), cRA = idx('RMA ALIGNMENT'), cCS = idx('CAPITAL STATUS'),
    cCA = idx('CAPITAL ALIGNMENT'), cCF = idx('NO OF CF'), cM = idx('REGIONAL MANAGER'), cH = idx('HOD'),
    cS = idx('JFA SALES MANAGER'), cR = idx('REGION'), cB = idx('BRANCH'), cST = idx('STATUS');
  const MO = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const cell = (r, i) => i < 0 ? '' : ((r.c[i] && (r.c[i].v ?? r.c[i].f)) || '');
  const P = ['Gauteng', 'KwaZulu-Natal', 'Eastern Cape', 'Western Cape', 'Northern Cape', 'Free State', 'North West', 'Limpopo', 'Mpumalanga'];
  const pick = s => { s = String(s).toLowerCase(); if (s.includes('gauteng')) return 'Gauteng'; if (s.includes('kwazulu') || s.includes('kwa-zulu') || s === 'kzn') return 'KwaZulu-Natal'; if (s.includes('eastern')) return 'Eastern Cape'; if (s.includes('western')) return 'Western Cape'; if (s.includes('northern')) return 'Northern Cape'; if (s.includes('free state')) return 'Free State'; if (s.includes('north west')) return 'North West'; if (s.includes('limpopo')) return 'Limpopo'; if (s.includes('mpumalanga')) return 'Mpumalanga'; return ''; };
  const out = [];
  resp.table.rows.forEach(r => {
    const dv = cell(r, cD);
    let d = null;
    if (dv && dv.getFullYear) d = new Date(dv.getTime());
    else if (typeof dv === 'string' && /^Date\(/.test(dv)) { const q = dv.slice(5, -1).split(',').map(Number); if (q.length >= 3) d = new Date(q[0], q[1], q[2]); }
    else { const p = String(cell(r, cD)).trim().replace(/-/g, ' ').split(/\s+/); if (p.length === 3) { const m = MO.indexOf(p[1].slice(0, 3).toUpperCase()); const y = parseInt(p[2], 10); const dd = parseInt(p[0], 10); if (m >= 0 && y > 2000) d = new Date(y, m, dd); } }
    if (!d) return;
    const mo = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const mi = MONTHS.findIndex(x => x.id === mo); if (mi < 0) return;
    const dayKey = d.toISOString().slice(0, 10);
    let di = DAYS.indexOf(dayKey); if (di < 0) { DAYS.push(dayKey); di = DAYS.length - 1; }
    const rs = String(cell(r, cRS)).toLowerCase(), ra = String(cell(r, cRA)).toLowerCase();
    const cs = String(cell(r, cCS)).toLowerCase(), ca = String(cell(r, cCA)).toLowerCase();
    const rmaOk = rs === 'signed' || ra === 'aligned' || ra === 'signed';
    const capOk = cs === 'signed' || ca === 'aligned';
    let prov = pick(cell(r, cH)) || pick(cell(r, cR)) || pick(cell(r, cB));
    const jn = String(cell(r, cJ)).trim().toLowerCase();
    let pi = prov ? P.indexOf(prov) : -1;
    if (pi < 0 && jn && JFAPROV.has(jn)) pi = JFAPROV.get(jn);
    if (jn && pi >= 0) JFAPROV.set(jn, pi);
    const pt = String(cell(r, cPT)).toLowerCase();
    const flags = (((rs && rs !== 'capital legacy') || pt === 'consolidation') ? 1 : 0) | ((cs || rs === 'capital legacy') ? 2 : 0) | (rmaOk ? 4 : 0) | (capOk ? 8 : 0) | ((rmaOk || capOk) ? 16 : 0);
    out.push([mi, pi < 0 ? 9 : pi,
      idxOf('jfa', M.jfas, cell(r, cJ)), idxOf('fa', M.fas, cell(r, cF)),
      idxOf('mgr', M.mgrs, cell(r, cM) || cell(r, cS)), idxOf('br', M.brs, cell(r, cB)),
      parseInt(cell(r, cP), 10) || 0, String(cell(r, cCF)).trim() === '1' ? 1 : 0,
      flags, idxOf('st', M.sts, cell(r, cST)), di]);
  });
  return out;
}

/* ---------------- identity maps for live refresh ---------------- */
const NAMEIX = {};
function nameIndex(kind, arr) {
  if (!NAMEIX[kind]) { NAMEIX[kind] = new Map(arr.map((n, i) => [String(n).toLowerCase(), i])); }
  return NAMEIX[kind];
}
function idxOf(kind, arr, name) {
  name = String(name || '').trim(); if (!name) return -1;
  const m = nameIndex(kind, arr), k = name.toLowerCase();
  if (m.has(k)) return m.get(k);
  arr.push(name); m.set(k, arr.length - 1); return arr.length - 1;
}
const JFAPROV = new Map();
R.forEach(r => { if (r[2] >= 0 && r[1] < 9) JFAPROV.set(String(M.jfas[r[2]]).toLowerCase(), r[1]); });

/* ---------------- boot ---------------- */
$('#refreshBtn').onclick = () => refreshLive(false);
$('#printBtn').onclick = () => window.print();
$('#clearBtn').onclick = () => { state.period = 'all'; state.prov = null; render(); };
render();
setTimeout(() => refreshLive(true), 1200);

</script>
